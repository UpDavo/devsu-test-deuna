# Mismas verificaciones que los pipelines, antes de cada commit.
# Instalar desde la raíz del repositorio: pre-commit install
repos:
  # Python de todas las tareas (mismas reglas que code-quality).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Terraform de las tareas 1 y 3.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        files: ^tarea-3-terraform-iac/
        args: [--args=--config=__GIT_WORKING_DIR__/tarea-3-terraform-iac/.tflint.hcl]
      - id: terraform_tflint
        alias: terraform_tflint_tarea_1
        files: ^tarea-1-monitoreo-ecs/terraform/
        args: [--args=--config=__GIT_WORKING_DIR__/tarea-1-monitoreo-ecs/terraform/.tflint.hcl]
      - id: terraform_checkov
        files: ^tarea-3-terraform-iac/
        args: [--args=--config-file __GIT_WORKING_DIR__/tarea-3-terraform-iac/.checkov.yaml]
      - id: terraform_trivy
        args: [--args=--severity=MEDIUM,HIGH,CRITICAL]

  # Secretos en cualquier archivo.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
