# Pipeline de la tarea 1: detector de escalamiento máximo en ECS.
#
# Pruebas del detector (Python) y validación del módulo Terraform que lo
# despliega. El módulo se consume desde el stack de cada cuenta, por eso este
# pipeline no aplica nada: solo valida.

name: tarea-1-monitoreo

on:
  pull_request:
    branches: [main]
    paths:
      - "tarea-1-monitoreo-ecs/**"
      - ".github/workflows/tarea-1-monitoreo.yml"
  push:
    branches: [main]
    paths:
      - "tarea-1-monitoreo-ecs/**"
      - ".github/workflows/tarea-1-monitoreo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarea-1-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.17.2
  TFLINT_VERSION: v0.66.0
  CHECKOV_IMAGE: bridgecrew/checkov:3.4.5
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tarea-1-monitoreo-ecs/lambda
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # mismo runtime que la Lambda
      # Sin dependencias: boto3 viene en el runtime y las pruebas usan dobles.
      - run: python -m unittest discover -s tests -v

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tarea-1-monitoreo-ecs/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
      # Pruebas en modo plan con credenciales ficticias: no requieren cuenta AWS.
      - run: terraform test

  # Plan opcional contra cada cuenta. Solo corre en los ambientes que tienen
  # sus variables de repositorio configuradas (ver README); si faltan, el job
  # termina en verde con un aviso. Rol de solo lectura y estado local vacío:
  # muestra lo que el módulo crearía, no modifica nada.
  plan:
    name: plan (${{ matrix.env }})
    needs: [terraform]
    # Los PR desde forks no reciben token OIDC: no pueden planificar contra AWS.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [development, sandbox, production]
    permissions:
      contents: read
      id-token: write # token OIDC para asumir el rol de AWS
    env:
      ENV: ${{ matrix.env }}
      AWS_PLAN_ROLE_ARN: ${{ vars[format('AWS_PLAN_ROLE_ARN_{0}', matrix.env)] }}
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_kms_key_arn: ${{ vars[format('TAREA1_KMS_KEY_ARN_{0}', matrix.env)] }}
    defaults:
      run:
        working-directory: tarea-1-monitoreo-ecs/terraform
    steps:
      - name: Verificar configuración del ambiente
        id: config
        working-directory: .
        run: |
          missing=()
          [ -n "$AWS_PLAN_ROLE_ARN" ] || missing+=("AWS_PLAN_ROLE_ARN_${ENV}")
          [ -n "$TF_VAR_kms_key_arn" ] || missing+=("TAREA1_KMS_KEY_ARN_${ENV}")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=plan ${ENV} omitido::Faltan variables de repositorio: ${missing[*]}"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        if: steps.config.outputs.enabled == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}-${{ github.run_attempt }}-t1-plan-${{ matrix.env }}
          aws-region: us-east-1

      - if: steps.config.outputs.enabled == 'true'
        run: terraform init -backend=false -lockfile=readonly
      - if: steps.config.outputs.enabled == 'true'
        run: terraform plan -lock=false -out="${ENV}.tfplan"

      # Solo conteos en el resumen: el repositorio es público.
      - name: Resumen del plan
        if: steps.config.outputs.enabled == 'true'
        run: |
          terraform show -json "${ENV}.tfplan" \
            | jq -r --arg env "$ENV" '
                [.resource_changes[]?.change.actions[]?] as $a
                | "### Plan tarea 1 \($env)\n\n| create | update | delete |\n|---|---|---|\n| \($a|map(select(.=="create"))|length) | \($a|map(select(.=="update"))|length) | \($a|map(select(.=="delete"))|length) |"
              ' >> "$GITHUB_STEP_SUMMARY"

  tflint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tarea-1-monitoreo-ecs/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact

  security:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tarea-1-monitoreo-ecs/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Las excepciones de Checkov están en línea en main.tf, cada una justificada.
      - name: checkov
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            --directory . --framework terraform --skip-path .terraform --compact --quiet
      - name: trivy config
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --exit-code 1 --severity MEDIUM,HIGH,CRITICAL --skip-dirs .terraform .

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: tarea-1-monitoreo-ecs/**/*.md
